# PROTOCOL LMS — усиление защиты для схемы «сайт + Directus на поддомене api».
# Это ДОПОЛНЕНИЯ к вашим существующим server-блокам (SSL и CORS у вас уже настроены certbot'ом/вручную) —
# не заменяйте файл целиком. Старый deploy/nginx-protocol-lms.conf написан под PocketBase.
#
# Применить:  правки внести → nginx -t → systemctl reload nginx
# Проверить:  curl -sI https://protocol-lms.ru/ | grep -iE "strict|content-security|x-frame|nosniff|referrer"

# ─────────────────────────────────────────────────────────────────────────────
# 0. На уровне http { } (например, /etc/nginx/conf.d/rate-limit.conf)
# ─────────────────────────────────────────────────────────────────────────────
# не более 5 попыток входа в минуту с одного IP (+ запас 5), остальные получают 429
limit_req_zone $binary_remote_addr zone=lms_login:10m rate=5r/m;
# общий потолок на API: 20 запросов/сек с IP (+ запас 40)
limit_req_zone $binary_remote_addr zone=lms_api:10m rate=20r/s;

# ─────────────────────────────────────────────────────────────────────────────
# 1. server { server_name protocol-lms.ru; ... }  — сайт (статика)
# ─────────────────────────────────────────────────────────────────────────────
#   add_header ... always; обязательно с always — иначе заголовок пропадёт на ошибках и редиректах.
#   Внимание: add_header в location заменяет заголовки сервера целиком — при добавлении
#   собственных add_header внутрь location (например, Cache-Control для /assets/) скопируйте и эти.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
# CSP «совместимый»: 'unsafe-eval' нужен ТОЛЬКО тренажёру кода (/app/playground, new Function).
# Когда тренажёр переедет в изолированную песочницу — уберите 'unsafe-eval' (см. docs/АУДИТ-БЕЗОПАСНОСТИ-2026-10.md, п. 6).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.protocol-lms.ru; font-src 'self' data:; connect-src 'self' https://api.protocol-lms.ru; media-src 'self' blob: https://api.protocol-lms.ru; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# index.html не кешируем (иначе после деплоя браузер держит старую сборку).
# ВАЖНО: так как внутри location есть свой add_header, повторите здесь заголовки безопасности выше
# (или вынесите их в snippets/security-headers.conf и подключите include в обоих местах).
#   location = /index.html { include snippets/security-headers.conf; add_header Cache-Control "no-store" always; }

# ─────────────────────────────────────────────────────────────────────────────
# 2. server { server_name api.protocol-lms.ru; ... }  — Directus
# ─────────────────────────────────────────────────────────────────────────────
# 2.1 Вход: жёсткий лимит попыток (защита от перебора паролей)
#   location = /auth/login {
#       limit_req zone=lms_login burst=5 nodelay;
#       limit_req_status 429;
#       proxy_pass http://127.0.0.1:8055;          # прокси-заголовки как в основном location
#       # + ваши CORS-заголовки (Access-Control-Allow-Origin https://protocol-lms.ru)
#   }
#
# 2.2 Панель управления Directus: только с вашего IP (API для сайта остаётся открытым)
#   location /admin {
#       allow 203.0.113.10;     # ← ваш IP
#       deny all;
#       proxy_pass http://127.0.0.1:8055;
#   }
#
# 2.3 Загруженные файлы: не исполнять активное содержимое (SVG/HTML, присланные студентами)
#   location /assets/ {
#       add_header Content-Security-Policy "sandbox" always;
#       add_header X-Content-Type-Options "nosniff" always;
#       # + ваши CORS-заголовки
#       proxy_pass http://127.0.0.1:8055;
#   }
#
# 2.4 Общий потолок запросов к API — в основной location:   limit_req zone=lms_api burst=40 nodelay;

# ─────────────────────────────────────────────────────────────────────────────
# 3. docker-compose.yml (сервис directus) — порт только на localhost + настройки
# ─────────────────────────────────────────────────────────────────────────────
#   ports:
#     - "127.0.0.1:8055:8055"          # НЕ "8055:8055": иначе Directus виден из интернета в обход nginx и HTTPS
#   environment:                        # добавить к существующим (секреты KEY/SECRET не менять)
#     RATE_LIMITER_ENABLED: "true"
#     RATE_LIMITER_POINTS: "100"        # запросов
#     RATE_LIMITER_DURATION: "1"        # за секунду на IP
#     ACCESS_TOKEN_TTL: "15m"
#     REFRESH_TOKEN_TTL: "7d"
#     FILES_MIME_TYPE_ALLOW_LIST: "image/*,application/pdf,text/*,application/zip,application/json,application/msword,application/vnd.*"
#     CORS_ENABLED: "false"             # CORS отдаёт nginx; два источника CORS дадут дубли заголовков
