# PROTOCOL LMS — nginx на Beget VPS.
# Один домен отдаёт статику фронтенда и проксирует PocketBase (тот же origin —
# нет CORS и нет mixed-content). Замените lms.example.ru на ваш домен.
#
# Куда класть: /etc/nginx/sites-available/protocol-lms.conf
# Активировать:  ln -s /etc/nginx/sites-available/protocol-lms.conf /etc/nginx/sites-enabled/
#                nginx -t && systemctl reload nginx
# HTTPS-сертификат добавит certbot автоматически (см. DEPLOY-HTTPS-BEGET.md).

server {
    listen 80;
    listen [::]:80;
    server_name lms.example.ru;

    # собранный фронтенд (npm run build -> папка dist)
    root /var/www/protocol-lms/dist;
    index index.html;

    # лимит на размер загрузки файлов (сдача работ: до 3 файлов по 10 МБ)
    client_max_body_size 40M;

    # --- security-заголовки ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS — включайте ТОЛЬКО когда HTTPS уже работает (иначе домен «залипнет» на https)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: всё со своего домена; inline-стили нужны для Tailwind/Framer; data/blob — для аватаров и превью
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # --- PocketBase API (включая realtime /api/realtime) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # для потоковой подписки (SSE) отключаем буферизацию
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # --- Админка PocketBase ---
    location /_/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA: любой маршрут отдаём index.html (react-router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html НЕ кешируем — иначе после деплоя браузер держит старую версию
    # и ссылается на несуществующие чанки (Failed to fetch dynamically imported module)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # долгое кеширование ассетов с хэшем в имени
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
